<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CashFlowy.com</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <header class="header">
      <div>
        <h1>CashFlowy</h1>
        <p class="subtitle">Smart Expense Manager</p>
      </div>
    </header>

    <section class="cards">

      <div class="card">
        <p>Balance</p>
        <h2 id="balance">₹0</h2>
      </div>

      <div class="card">
        <p>Income</p>
        <h2 id="income" class="green">₹0</h2>
      </div>

      <div class="card">
        <p>Expense</p>
        <h2 id="expense" class="red">₹0</h2>
      </div>

    </section>

    <section class="form-section">
      <h3>Add new entry</h3>

      <form id="form">

        <label for="description">Description</label>
        <input
          type="text"
          id="description"
          placeholder="e.g. Chai, Shopping"
          maxlength="80">

        <label for="amount">Amount</label>
        <input
          type="number"
          id="amount"
          placeholder="Enter amount"
          min="0.01"
          step="0.01">

        <label for="type">Transaction Type</label>
        <select id="type">
          <option value="expense">Expense</option>
          <option value="income">Income</option>
        </select>

        <button type="submit">Add Transaction</button>

      </form>

      <p id="message" class="red" aria-live="polite"></p>
    </section>

    <section class="history-section">
      <h3>Transaction History</h3>
      <ul id="list"></ul>
    </section>

  </div>

  <script src="script.js"></script>

</body>
</html>
