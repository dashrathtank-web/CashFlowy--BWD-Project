<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CashFlowy.com</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <h1>CashFlowy</h1>
    <p class="subtitle">Smart Expense Manager</p>

    <!-- Balance, income and expense -->
    <div class="cards">
      <div class="card">
        <p>Balance</p>
        <h2 id="balance">₹0</h2>
      </div>
      <div class="card">
        <p>Income</p>
        <h2 id="income" class="green">₹0</h2>
      </div>
      <div class="card">
        <p>Expense</p>
        <h2 id="expense" class="red">₹0</h2>
      </div>
    </div>

    <!-- Form to add a new entry -->
    <h3>Add new entry</h3>
    <form id="form">
      <input type="text" id="description" placeholder="Description (e.g. Chai)">
      <input type="number" id="amount" placeholder="Amount">
      <select id="type">
        <option value="expense">Expense</option>
        <option value="income">Income</option>
      </select>
      <button type="submit">Add</button>
    </form>
    <p id="message" class="red"></p>

    <!-- List of all entries -->
    <h3>History</h3>
    <ul id="list"></ul>

  </div>

 <script src="script.js"></script> 
</body>
</html>
